name: Feature request
description: Suggest an improvement to vue3-mobile-nav.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the feature
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
